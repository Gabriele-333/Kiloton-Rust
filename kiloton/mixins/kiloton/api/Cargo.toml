[package]
name = "mod-kiloton"
version = "1.3.0"
edition = "2024"
publish = false

[dependencies]
# The launcher points this at the Horizon source it builds the game from.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0" }
# The bundle's own [[crate]]: the launcher points this at its staged copy.
kiloton-core = { path = "../kiloton-core" }
log = "0.4"
serde_json = "1"
