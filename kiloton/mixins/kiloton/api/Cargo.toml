horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "1bec6d447afffd35d18401d80bbee78982235975" }
# The bundle's own [[crate]]: the launcher points this at its staged copy.
kiloton-core = { path = "../kiloton-core" }
log = "0.4"
serde_json = "1"
