# Kiloton for Horizon: a native trait mod. Its blocks, items, textures, models, sounds, languages
# and data are the content beside this folder (horizon-mod.toml, assets/, data/), the same mod id.
[mod]
id = "kiloton"
version = "1.3.0"

# The Horizon commit it is built and tested on.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The hooks: horizon_client::mod_api::Hooks, returned by api's hooks().
[api]
path = "api"

# What the blast, the machines and the bombs need of the level being ticked, which the Host API doesn't
# give and the [api] crate can't reach (Game's own methods are private to `game`): the game's block
# facts and blocks, its fluid ticks, its explosions and the energy between blocks. The module puts
# that glue inside `game` as the public `horizon_client::game::kiloton`, where the mod installs its
# `Level` at start; the injection runs it at the head of each level's tick end, before the
# level_tick_post hook, so the sweep reads here and writes there.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "kiloton"
source = "glue/game_kiloton.rs"
visibility = "pub"

[[injection]]
id = "level"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "glue/level.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "dimension", ty = "&str", value = "dimension" },
]

# The physics and the visual model: pure Rust, compiled once and tested on its own.
[[crate]]
id = "kiloton-core"
path = "kiloton-core"
